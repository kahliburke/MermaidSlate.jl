name = "MermaidSlate"
uuid = "8b1dd0a1-40b8-40bb-ae57-fd8e602dd54e"
version = "0.1.1"
authors = ["Kahli Burke <kahli@kahliburke.com>"]

# A Slate extension: depends ONLY on the lean SlateExtensionsBase SDK, never on KaimonSlate.
[deps]
SlateExtensionsBase = "bc31d39e-4442-48fa-b9ae-1bd99fed63f7"

[compat]
# 0.10 is the floor: `register_fence_renderer!` and `provide_import!` arrived there, and this package
# calls both unguarded from `__init__`. An earlier SEB resolves fine and then fails at load.
SlateExtensionsBase = "0.10"
julia = "1.10"

[extras]
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test"]
