# Catalog listing for Slate's Extensions gallery. Every key is optional — without this file the
# package still lists, using its name, version, repo and module docstring. This fills in the parts
# that can't be harvested.

title    = "Mermaid"
tagline  = "Mermaid diagrams as computed values — text in, diagram out"
icon     = "🧜"
categories = ["visualization", "documents"]

# The demo notebook. The gallery links to it, and docs/generate_extension_assets.mjs in the
# KaimonSlate repo runs it headless to photograph the page.
example = "notebooks/mermaid.jl"

# Card imagery, hosted on this repo's `media` release rather than committed — screenshots get
# regenerated often and don't belong in git history. The catalog build mirrors these into the
# published artifact, so the release only has to be reachable when the catalog is built, and each
# asset must stay under 8 MB to be mirrored.
#
# Regenerate the screenshot from the KaimonSlate repo:
#   node docs/generate_extension_assets.mjs --path /path/to/MermaidSlate.jl
#   gh release upload media "$TMPDIR/slate-ext-assets/MermaidSlate-notebook.png" --clobber
screenshots = ["https://github.com/kahliburke/MermaidSlate.jl/releases/download/media/MermaidSlate-notebook.png"]

# Hand-recorded, not generated — a walkthrough needs someone deciding what to show. Downscaled to
# 1600px for the card; the full-resolution capture is kept outside this repo.
video = "https://github.com/kahliburke/MermaidSlate.jl/releases/download/media/MermaidSlate-demo.mp4"

snippet = """
using MermaidSlate
mermaid("flowchart LR; A --> B")
"""

# Plain text: the gallery and the catalog site both render these literally, so markdown here shows
# up as stray backticks.
provides = [
    "mermaid(src; theme) — a diagram value any cell can return",
    "Markdown fence renderer: a mermaid-tagged block renders in place",
    "Diagrams built from live values, so the picture follows the data",
]
